  <style>
    :root {
      --black:      #030406;
      --off-black:  #0d0f12;
      --soft-white: #f4f4f1;
      --muted:      rgba(244,244,241,.55);
      --line:       rgba(255,255,255,.09);
      --teal:       #3dd8c5;
      /* Matches the sans-serif used site-wide (was Georgia serif, inconsistent with every other page) */
      --serif:      'Helvetica Neue', Helvetica, Arial, sans-serif;
      --sans:       'Helvetica Neue', Helvetica, Arial, sans-serif;
      --max-prose:  680px;
    }
    * { box-sizing: border-box; }
    html { background: var(--black); }
    body {
      margin: 0; background: var(--black); color: var(--soft-white);
      font-family: var(--sans);
      overflow-x: hidden; text-rendering: geometricPrecision;
    }
    a { color: inherit; text-decoration: none; }

    /* ── Nav ── */
    .nav {
      position: fixed; z-index: 100; top: 28px; left: 30px; right: 30px;
      display: flex; align-items: center; justify-content: space-between;
      pointer-events: none;
    }
    .brand-logo { pointer-events: auto; width: 54px; height: auto; display: block; }
    .nav-items {
      pointer-events: auto; display: flex; align-items: center;
      gap: clamp(16px, 2.2vw, 34px); padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.075);
      background: rgba(3,4,6,.20); backdrop-filter: blur(18px);
    }
    .nav-items a {
      font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      font-weight: 400; color: rgba(244,244,241,.80);
      white-space: nowrap; transition: color .3s ease;
    }
    .nav-items a.is-current { color: var(--teal); }
    .nav-items a:hover { color: rgba(244,244,241,1); }

    /* ── Mobile nav toggle + drawer ── */
    .nav-toggle {
      display: none; pointer-events: auto;
      width: 42px; height: 42px; flex-direction: column;
      align-items: center; justify-content: center; gap: 5px;
      border: 1px solid rgba(255,255,255,.15);
      background: rgba(3,4,6,.35); backdrop-filter: blur(18px);
      cursor: pointer;
    }
    .nav-toggle span {
      display: block; width: 18px; height: 1px; background: var(--soft-white);
      transition: transform .3s ease, opacity .3s ease;
    }
    .nav-toggle.is-open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-toggle.is-open span:nth-child(2) { opacity: 0; }
    .nav-toggle.is-open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }
    .nav-drawer {
      position: fixed; top: 0; left: 0; right: 0; z-index: 150;
      background: rgba(3,4,6,.97); border-bottom: 1px solid var(--line);
      padding: 96px 26px 26px; display: flex; flex-direction: column; gap: 4px;
      transform: translateY(-100%); opacity: 0; pointer-events: none;
      transition: transform .35s ease, opacity .35s ease;
    }
    .nav-drawer.is-open { transform: translateY(0); opacity: 1; pointer-events: auto; }
    .nav-drawer a {
      font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
      color: rgba(244,244,241,.85); padding: 14px 2px;
      border-bottom: 1px solid var(--line);
    }
    .nav-drawer a:hover { color: var(--teal); }
    @media (max-width: 860px) {
      .nav-items { display: none; }
      .nav-toggle { display: flex; }
    }

    /* ── Breadcrumb ── */
    .case-breadcrumb {
      max-width: var(--max-prose); margin: 0 auto;
      padding: 28px 28px 0;
      font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--muted);
    }
    .case-breadcrumb a { color: rgba(244,244,241,.7); transition: color .2s ease; }
    .case-breadcrumb a:hover { color: var(--teal); }

    /* ── Reveal ── */
    .reveal {
      opacity: 0; transform: translateY(32px);
      transition: opacity .9s cubic-bezier(.16,1,.3,1), transform .9s cubic-bezier(.16,1,.3,1);
    }
    .reveal.is-visible { opacity: 1; transform: none; }
    .delay-1 { transition-delay: .1s; }
    .delay-2 { transition-delay: .2s; }

    /* Hero */
    .case-hero {
      width: 100%; height: clamp(320px, 60vh, 640px);
      overflow: hidden; position: relative;
      background: linear-gradient(160deg, #0d1117, #1a1f2e 60%, #0d1117);
    }
    .case-hero img {
      width: 100%; height: 100%; object-fit: cover;
      display: block; opacity: .85;
    }
    .case-hero::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(3,4,6,0) 35%, rgba(3,4,6,.9));
    }

    .case-wrap {
      max-width: var(--max-prose); margin: 0 auto;
      padding: 0 28px 100px;
    }
    .case-meta {
      padding: 48px 0 36px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 44px;
    }
    .case-client {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--teal); display: block; margin-bottom: 20px;
    }
    .case-title {
      font-family: var(--serif);
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 400; line-height: 1.15;
      color: var(--soft-white);
      margin-bottom: 20px;
    }
    .case-dateline {
      font-size: 12px; color: var(--muted); letter-spacing: .05em;
    }
    .case-summary {
      font-family: var(--serif); font-style: italic;
      font-size: clamp(17px, 2vw, 20px); line-height: 1.6;
      color: rgba(244,244,241,.82); margin: 0 0 8px;
    }

    .case-body { font-family: var(--serif); }
    .case-body p {
      font-size: clamp(16px, 1.8vw, 18px);
      line-height: 1.85; color: rgba(244,244,241,.88);
      margin-bottom: 28px;
    }
    .case-body p strong { color: var(--soft-white); font-weight: 600; }
    .case-body p em { font-style: italic; }
    .case-body a { color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }
    .case-body .case-img {
      width: calc(100% + 56px); margin: 40px -28px;
      aspect-ratio: 16/9; object-fit: cover; display: block;
    }
    .case-pending {
      font-size: 14px; color: var(--muted); font-style: italic;
      padding: 18px 0 0;
    }

    .case-video {
      position: relative; width: 100%; aspect-ratio: 16/9;
      margin: 8px 0 40px; background: #0d1117;
    }
    .case-video iframe {
      position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
    }

    .case-notfound {
      min-height: 60vh; display: grid; place-items: center; text-align: center;
      padding: 120px 28px;
    }
    .case-notfound .notfound-title { font-family: var(--serif); font-weight: 400; font-size: 28px; margin-bottom: 16px; }
    .case-notfound p { color: var(--muted); font-size: 14px; }

    /* ── Social footer (icon-only, matches proof.html) ── */
    .social-footer {
      display: flex; align-items: center; justify-content: center;
      gap: 1.4rem; padding: 2rem 34px;
      border-top: 1px solid var(--line);
      background: var(--black);
      position: relative; z-index: 2;
    }
    .social-footer a {
      display: flex; align-items: center; justify-content: center;
      width: 38px; height: 38px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: rgba(244,244,241,.4);
      transition: color .3s, border-color .3s, transform .3s;
    }
    .social-footer a:hover {
      color: var(--teal);
      border-color: var(--teal);
      transform: scale(1.1);
    }
    .social-footer svg { width: 15px; height: 15px; fill: currentColor; }

    @media (max-width: 640px) {
      .nav-items { gap: 14px; padding: 12px 14px; }
    }

    .spinner {
      display: flex; align-items: center; justify-content: center;
      padding: 120px; min-height: 40vh;
    }
    .spinner::after {
      content: ''; width: 32px; height: 32px;
      border: 1px solid var(--line); border-top-color: var(--teal);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<script>
/* ── Mobile nav toggle ── */
(function () {
  var toggle = document.getElementById("navToggle");
  var drawer = document.getElementById("navDrawer");
  if (!toggle || !drawer) return;
  toggle.addEventListener("click", function (e) {
    e.stopPropagation();
    var open = drawer.classList.toggle("is-open");
    toggle.classList.toggle("is-open", open);
    toggle.setAttribute("aria-expanded", open ? "true" : "false");
  });
  drawer.querySelectorAll("a").forEach(function (a) {
    a.addEventListener("click", function () {
      drawer.classList.remove("is-open");
      toggle.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
    });
  });
  document.addEventListener("click", function (e) {
    if (!drawer.contains(e.target) && !toggle.contains(e.target)) {
      drawer.classList.remove("is-open");
      toggle.classList.remove("is-open");
      toggle.setAttribute("aria-expanded", "false");
    }
  });
})();
</script>

<script>
(function () {
  var PROJECT = 'yodi9k1k', DATASET = 'production';
  var SANITY_CDN = 'https://' + PROJECT + '.apicdn.sanity.io/v2021-06-07/data/query/' + DATASET;
  var IMG_BASE  = 'https://cdn.sanity.io/images/' + PROJECT + '/' + DATASET + '/';

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function sanityImgUrl(ref, w, h) {
    if (!ref) return '';
    var r = ref.replace('image-', '').replace(/-(\w+)$/, '.$1');
    return IMG_BASE + r + '?w=' + (w||1600) + (h ? '&h='+h : '') + '&fit=crop&auto=format';
  }

  function renderBlocks(blocks) {
    if (!blocks || !blocks.length) return '';
    return blocks.map(function (block) {
      if (block._type === 'image' && block.asset) {
        var url = sanityImgUrl(block.asset._ref, 1360, 765);
        return '<img class="case-img" src="' + url + '" alt="" loading="lazy" />';
      }
      if (block._type !== 'block') return '';
      var html = (block.children || []).map(function (span) {
        var t = span.text
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        var marks = span.marks || [];
        if (marks.indexOf('strong') > -1) t = '<strong>' + t + '</strong>';
        if (marks.indexOf('em') > -1)     t = '<em>' + t + '</em>';
        return t;
      }).join('');
      return '<p>' + html + '</p>';
    }).join('');
  }

  function videoEmbedHtml(type, idOrUrl) {
    if (!type || type === 'none' || !idOrUrl) return '';
    if (type === 'youtube') {
      var ytId = idOrUrl;
      var m = idOrUrl.match(/(?:v=|youtu\.be\/|embed\/)([a-zA-Z0-9_-]{6,})/);
      if (m) ytId = m[1];
      return '<iframe src="https://www.youtube.com/embed/' + esc(ytId) + '" allowfullscreen loading="lazy"></iframe>';
    }
    if (type === 'vimeo') {
      var vId = idOrUrl;
      var mv = idOrUrl.match(/vimeo\.com\/(\d+)/);
      if (mv) vId = mv[1];
      return '<iframe src="https://player.vimeo.com/video/' + esc(vId) + '" allowfullscreen loading="lazy"></iframe>';
    }
    if (type === 'cloudflare') {
      return '<iframe src="https://iframe.videodelivery.net/' + esc(idOrUrl) + '" allowfullscreen loading="lazy"></iframe>';
    }
    return '';
  }

  function getSlugFromPath() {
    var path = window.location.pathname;
    var m = path.match(/\/case\/([^/]+)\/?$/);
    if (m) return decodeURIComponent(m[1]);
    var params = new URLSearchParams(window.location.search);
    return params.get('slug');
  }

  function fmtRange(yearTimeframe, geography) {
    var parts = [];
    if (geography && geography.length) parts.push(geography.join(' · '));
    if (yearTimeframe) parts.push(yearTimeframe);
    return parts.join(' — ');
  }

  function showNotFound() {
    document.getElementById('case-loading').style.display = 'none';
    document.getElementById('case-notfound').style.display = 'block';
    document.getElementById('site-footer').style.display = 'flex';
  }

  var slug = getSlugFromPath();
  if (!slug) { showNotFound(); return; }

  var q = encodeURIComponent(
    '*[_type=="caseStudy" && slug.current=="' + slug + '"][0]{' +
      'title, clientName, "slug": slug.current, geography, yearTimeframe, bodyContent,' +
      '"heroImageUrl": heroImage.asset->url,' +
      'oneLinerSummary, videoSourceType, videoUrlOrId,' +
      'seoTitle, seoDescription' +
    '}'
  );

  fetch(SANITY_CDN + '?query=' + q)
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var c = d.result;
      if (!c) { showNotFound(); return; }

      var fullTitle = (c.seoTitle || c.title || 'Case study') + ' — Creators Network';
      var fullDesc = c.seoDescription || c.oneLinerSummary || '';
      var canonicalUrl = 'https://creatorsnetwork.io/case/' + (c.slug || slug);

      document.getElementById('meta-title').textContent = fullTitle;
      var descEl = document.getElementById('meta-desc');
      if (descEl) descEl.content = fullDesc;

      // Keep og:title / og:description / og:url / og:image / canonical in sync with
      // the actual case study instead of the generic template defaults — previously
      // every /case/[slug] page reported og:url as the shared "case.html" template.
      var ogTitleEl = document.getElementById('og-title');
      if (ogTitleEl) ogTitleEl.content = fullTitle;
      var ogDescEl = document.getElementById('og-desc');
      if (ogDescEl) ogDescEl.content = fullDesc;
      var ogUrlEl = document.getElementById('og-url');
      if (ogUrlEl) ogUrlEl.content = canonicalUrl;
      var canonicalEl = document.getElementById('canonical-link');
      if (canonicalEl) canonicalEl.href = canonicalUrl;
      if (c.heroImageUrl) {
        var ogImgUrl = c.heroImageUrl + '?w=1200&h=630&fit=crop&auto=format';
        var ogImageEl = document.getElementById('og-image');
        if (ogImageEl) ogImageEl.content = ogImgUrl;
        var twitterImageEl = document.getElementById('twitter-image');
        if (twitterImageEl) twitterImageEl.content = ogImgUrl;
      }

      var heroImg = document.getElementById('case-hero-img');
      if (c.heroImageUrl) {
        heroImg.src = c.heroImageUrl + '?w=1800&auto=format';
        heroImg.style.display = 'block';
      }

      document.getElementById('case-client').textContent = c.clientName || '';
      document.getElementById('case-title').textContent = c.title || '';
      document.getElementById('case-dateline').textContent = fmtRange(c.yearTimeframe, c.geography);

      var bcTitle = document.getElementById('case-breadcrumb-title');
      if (bcTitle) bcTitle.textContent = c.title || 'Case study';
      var bcEl = document.getElementById('case-breadcrumb');
      if (bcEl) bcEl.style.display = 'block';

      var bodyHtml = renderBlocks(c.bodyContent || []);
      if (!bodyHtml) {
        if (c.oneLinerSummary) {
          var sEl = document.getElementById('case-summary');
          sEl.textContent = c.oneLinerSummary;
          sEl.style.display = 'block';
        }
        bodyHtml = '<p class="case-pending">The full write-up for this case study is coming soon.</p>';
      }
      document.getElementById('case-body').innerHTML = bodyHtml;

      var videoHtml = videoEmbedHtml(c.videoSourceType, c.videoUrlOrId);
      if (videoHtml) {
        var vEl = document.getElementById('case-video');
        vEl.innerHTML = videoHtml;
        vEl.style.display = 'block';
      }

      document.getElementById('case-loading').style.display = 'none';
      document.getElementById('case-content').style.display = 'block';
      document.getElementById('site-footer').style.display = 'flex';

      setTimeout(function () {
        document.querySelectorAll('.reveal').forEach(function (el) { el.classList.add('is-visible'); });
      }, 60);
    })
    .catch(function () { showNotFound(); });
})();
</script>

<!-- Sanity: siteSettings — populate social footer URLs -->
<script>
(function() {
  var PROJECT = 'yodi9k1k', DATASET = 'production';
  var q = encodeURIComponent('*[_type=="siteSettings"][0]{instagramUrl,facebookUrl,linkedinUrl,xUrl,youtubeUrl}');
  fetch('https://' + PROJECT + '.apicdn.sanity.io/v2021-06-07/data/query/' + DATASET + '?query=' + q)
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var s = d.result;
      if (!s) return;
      var map = {
        'Instagram': s.instagramUrl,
        'Facebook': s.facebookUrl,
        'LinkedIn': s.linkedinUrl,
        'X': s.xUrl,
        'YouTube': s.youtubeUrl,
      };
      document.querySelectorAll('#site-footer a[aria-label]').forEach(function(a) {
        var label = a.getAttribute('aria-label');
        var url = map[label];
        if (url) { a.href = url; }
      });
    })
    .catch(function() {});
})();
</script>
